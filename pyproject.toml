[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-intel-radar"
version = "0.1.0"
description = "Track AI product launches, model releases, and open source projects from known vendors and unknown discovery signals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Angus Fan" }
]
dependencies = []

[project.scripts]
ai-intel-radar = "ai_intel_radar.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
