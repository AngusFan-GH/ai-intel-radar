name: Daily Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

jobs:
  run-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-build-isolation -e .

      - name: Run daily collection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_INTEL_HTTP_TIMEOUT: "8"
          AI_INTEL_MAX_WORKERS: "8"
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_REPORT_URL: ${{ secrets.FEISHU_REPORT_URL }}
          FEISHU_TOP_N: ${{ secrets.FEISHU_TOP_N }}
        run: |
          ai-intel-radar run-daily

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ docs/
          git diff --cached --quiet && exit 0
          git commit -m "Update radar report"
          git push
